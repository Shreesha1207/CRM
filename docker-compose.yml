# Local, production-like stack: API + static frontend behind nginx.
# The database is external (e.g. hosted on Railway): put its URL in .env as
# DATABASE_URL (see .env.example). The API applies migrations when it starts.
#   docker compose up --build
#   docker compose exec backend python -m app.seed   # optional demo data
# Then open http://localhost:8080
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      CORS_ORIGINS: '["http://localhost:8080"]'
      FRONTEND_URL: http://localhost:8080
      # E-mail: "console" only logs messages; set EMAIL_BACKEND=smtp and the SMTP_* values in
      # .env to really send them (see .env.example for Gmail).
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
      # Booking assistant (see README): one Groq key for the model and the guards.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      CHAT_MODEL: ${CHAT_MODEL:-openai/gpt-oss-20b}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT-low}
      GUARD_TOPIC_MODEL: ${GUARD_TOPIC_MODEL:-openai/gpt-oss-20b}
      GUARD_INJECTION_MODEL: ${GUARD_INJECTION_MODEL-meta-llama/llama-prompt-guard-2-86m}
      GUARD_INJECTION_THRESHOLD: ${GUARD_INJECTION_THRESHOLD:-0.8}

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
